[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malpipe"
version = "0.1.0"
description = "Pipeline de dados e analytics engineering sobre o MyAnimeList (MAL API v2, Jikan, anime-offline-database, Kaggle) com DuckDB + dbt."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gabriel Silva Grande" }]
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "dbt-duckdb>=1.8",
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "scipy>=1.12",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1.0",
  "zstandard>=0.22",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "plotly>=5.22"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
malpipe = "malpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
