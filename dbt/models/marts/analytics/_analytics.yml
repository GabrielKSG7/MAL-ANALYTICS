version: 2

models:
  - name: mart_studio_performance
    description: Ranking de estúdios por qualidade (nota bayesiana ponderada), consistência e alcance.
    columns:
      - name: studio_id
        data_tests: [unique, not_null]
      - name: num_titles
        data_tests:
          - value_between: {arguments: {min_value: "{{ var('studio_min_titles') }}"}}

  - name: mart_season_trends
    description: Panorama por temporada — volume, nota, destaque, peso de sequências e de cada origem.
    columns:
      - name: season_key
        data_tests: [unique, not_null]

  - name: mart_score_inflation
    description: Distribuição de notas por ano de estreia, para investigar inflação de notas.
    columns:
      - name: season_year
        data_tests: [unique, not_null]

  - name: mart_genre_trends
    description: Gênero × ano — participação no catálogo, nota média e audiência.
    data_tests:
      - unique_combination: {arguments: {columns: [season_year, genre_id]}}
    columns:
      - name: share_of_year
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}

  - name: mart_polarizing_anime
    description: Animes mais polarizadores ("ame ou odeie"), com volume mínimo de votos.
    columns:
      - name: mal_id
        data_tests: [unique, not_null]

  - name: mart_hidden_gems
    description: Nota no topo (entre títulos com votos suficientes) e poucos membros — boas descobertas.
    columns:
      - name: mal_id
        data_tests: [unique, not_null]

  - name: mart_franchise_summary
    description: >
      Resumo por franquia (2+ entradas). Nome = entrada mais popular; evolução da nota compara a
      primeira e a última temporada de TV (nula se a franquia tem menos de 2 entradas de TV com nota).
    columns:
      - name: franchise_id
        data_tests: [unique, not_null]
      - name: num_entries
        data_tests:
          - value_between: {arguments: {min_value: 2}}

  - name: mart_anime_trending
    description: Variação de nota, membros e rank entre as duas extrações mais recentes de cada anime.
    columns:
      - name: mal_id
        data_tests: [unique, not_null]

  - name: mart_drop_rate_by_genre
    description: Taxa de abandono por gênero a partir do comportamento real dos usuários (Kaggle).
    columns:
      - name: genre_id
        data_tests: [unique, not_null]
      - name: drop_rate
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}

  - name: mart_my_profile_vs_mal
    description: Sua nota vs a da comunidade por gênero, estúdio, formato e década (formato longo).
    data_tests:
      - unique_combination: {arguments: {columns: [username, dimension, value]}}
    columns:
      - name: dimension
        data_tests:
          - accepted_values:
              arguments: {values: [genre, studio, media_type, decade, overall]}

  - name: mart_seiyuu_network
    description: Arestas do grafo de dubladores (co-protagonismo), prontas para Gephi/NetworkX.
    data_tests:
      - unique_combination: {arguments: {columns: [person_a, person_b]}}

  - name: mart_voice_actor_ranking
    description: Dubladores por volume, protagonismo, nota média dos animes e papel mais famoso.
    columns:
      - name: person_id
        data_tests: [unique, not_null]

  - name: mart_director_performance
    description: Diretores (3+ obras com nota) — mediana, consistência, alcance e melhor obra.
    columns:
      - name: person_id
        data_tests: [unique, not_null]

  - name: mart_episode_trends
    description: Episódios exibidos por ano — volume, animes no ar e duração média.
    columns:
      - name: aired_year
        data_tests: [unique, not_null]

  - name: mart_manga_adaptation_gap
    description: Obras originais populares e bem avaliadas que ainda não viraram anime.
    columns:
      - name: manga_id
        data_tests: [unique, not_null]

  - name: mart_adaptation_scores
    description: >
      Nota da obra original × nota de cada adaptação em anime. Uma linha por anime, comparado com a sua
      obra de origem principal (a mais popular).
    data_tests:
      - unique_combination: {arguments: {columns: [manga_id, mal_id]}}
      - unique_combination: {arguments: {columns: [mal_id]}}
    columns:
      - name: num_source_works
        description: Quantas obras de origem o anime tem. Os achados usam só os animes com uma (comparação sem ambiguidade).
        data_tests:
          - value_between: {arguments: {min_value: 1}}

exposures:
  - name: public_site
    label: Painel público (GitHub Pages)
    type: dashboard
    maturity: high
    url: https://gabrielksg7.github.io/MAL-ANALYTICS/
    description: >
      Página estática com os principais achados, gerada por `malpipe site` a partir das marts (só dados
      agregados) e publicada pelo workflow pages.yml.
    depends_on:
      - ref('mart_score_inflation')
      - ref('mart_season_trends')
      - ref('mart_adaptation_scores')
      - ref('mart_studio_performance')
      - ref('mart_voice_actor_ranking')
      - ref('mart_episode_trends')
      - ref('mart_manga_adaptation_gap')
      - ref('dim_manga')
      - ref('fct_my_list')
    owner:
      name: Gabriel Silva Grande

  - name: streamlit_dashboard
    label: Dashboard MAL Analytics (Streamlit)
    type: dashboard
    maturity: medium
    url: http://localhost:8501
    description: Painel local com visão geral, estúdios, temporadas, polarização, franquias, meu perfil e recomendações.
    depends_on:
      - ref('dim_anime')
      - ref('mart_studio_performance')
      - ref('mart_season_trends')
      - ref('mart_score_inflation')
      - ref('mart_genre_trends')
      - ref('mart_polarizing_anime')
      - ref('mart_hidden_gems')
      - ref('mart_franchise_summary')
      - ref('mart_anime_trending')
      - ref('mart_drop_rate_by_genre')
      - ref('mart_my_profile_vs_mal')
      - ref('fct_my_list')
    owner:
      name: Gabriel Silva Grande

  - name: recommender
    label: Recomendador (malpipe.recsys)
    type: ml
    maturity: medium
    description: Treina item-kNN, SVD e baseline de popularidade sobre fct_user_rating e recomenda para a sua lista.
    depends_on:
      - ref('fct_user_rating')
      - ref('fct_my_list')
      - ref('dim_anime')
      - ref('stg_jikan__recommendations')
    owner:
      name: Gabriel Silva Grande
